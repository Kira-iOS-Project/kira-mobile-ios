# The pull-request quality gate for this iOS app, installed by /agent-ios-swiftui:setup. The checks
# live in agent-config-kit's reusable ios-swiftui-quality-gate workflow, pinned below to one commit:
# a Linux job runs the checks that need no Mac (the String Catalog, error-code, suppression and
# privacy checks, secrets, the skill scan), and only when it passes does a macOS job with Xcode 27
# run the whole of scripts/check/gates.list (SwiftLint included), the simulator build (no signing, no
# warning), the tests and the accessibility audit, the catalog against the build, dead code, client
# drift and the coverage floor. A third job, "Quality Gate (ios-swiftui)", reports both: make that
# one the required status check.
#
# /agent-ios-swiftui:sync brings a new pin when a plugin release moves it; nothing moves on its own.
# The macOS job runs on the repository variable CI_RUNNER_MACOS, else GitHub's xcode-27 runner.
name: Quality Gate

on:
  # Every pull request, whatever branch it targets: a branch filter that misses this repo's
  # branches would leave the gate silent. Diff steps compare against the pull request's base.
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    permissions:
      contents: read
    # No secrets: the gate reads the checkout and nothing else, and never signs a build.
    uses: adhibuchori/agent-config-kit/.github/workflows/ios-swiftui-quality-gate.yml@dbb6e8a416b701d6f3669289e5857dfa90492667 # v1.4.0
    with:
      # KiraCI builds the same app and test target as Kira but runs only the quick UI tests
      # (AmountField, AmountFieldSize, DockSpacing). The accessibility audit of every primary screen
      # (AGENTS.md Rule 24) stays in the Kira scheme and runs locally with
      # `bash scripts/ios/app.sh ui-test`: on GitHub's macOS runner it never finished inside 90
      # minutes, and its contrast samples there read screens mid-fade, so every pull request was
      # cancelled and queued the next ones behind it for hours.
      scheme: KiraCI
      timeout-minutes: 30
