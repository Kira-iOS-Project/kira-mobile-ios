# Firebase App Distribution: when a pull request merges into prod, build the Release app, sign it
# Ad Hoc, and hand the IPA to the Firebase tester groups.
#
# Two jobs, so no job holds both kinds of credential:
#   build       macOS with Xcode 27. Imports the distribution certificate into a throwaway keychain
#               (random password per run), installs the Ad Hoc profile, archives, exports the IPA
#               and keeps it as a one-day artifact. Holds the Apple secrets and nothing else.
#   distribute  Linux. Signs in to Google (Workload Identity Federation, or a service account key),
#               uploads the IPA through the Firebase App Distribution REST API with curl, and sends
#               it to the tester groups. No npm package and no third-party CLI touches the release.
#
# Every input and how to create it: docs/firebase-app-distribution.md.
name: Firebase App Distribution

on:
  pull_request:
    types: [closed]
    branches: [prod]

permissions: {}

# One distribution at a time and none cancelled: each merge into prod reaches the testers, in order.
concurrency:
  group: firebase-distribution
  cancel-in-progress: false

jobs:
  build:
    name: Build and Sign (Ad Hoc)
    # A merge only, and only of a branch of this repository: a fork's run gets no secrets anyway.
    # FIREBASE_APP_ID is the switch: until docs/firebase-app-distribution.md is done, a merge into
    # prod skips the release instead of failing it. Once set, every other input is checked loudly.
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.FIREBASE_APP_ID != ''
    runs-on: ${{ vars.CI_RUNNER_MACOS || 'xcode-27' }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      BUNDLE_ID: com.kira

    steps:
      - name: Checkout the merged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          persist-credentials: false

      - name: Install the certificate and the profile
        id: signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          xcodebuild -version
          missing=()
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secret(s): ${missing[*]}. See docs/firebase-app-distribution.md."
            exit 1
          fi

          umask 077
          keychain="$RUNNER_TEMP/kira-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          cert="$RUNNER_TEMP/kira-distribution.p12"
          profile="$RUNNER_TEMP/kira-adhoc.mobileprovision"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$cert"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$profile"

          # The profile itself names the team, the app and its own name: nothing to keep in sync.
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          read_profile() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/profile.plist"; }
          name="$(read_profile Name)"
          uuid="$(read_profile UUID)"
          team="$(read_profile TeamIdentifier:0)"
          app_id="$(read_profile Entitlements:application-identifier)"
          if [ "$app_id" != "$team.$BUNDLE_ID" ]; then
            echo "::error::The profile is for $app_id, not $team.$BUNDLE_ID."
            exit 1
          fi
          if ! read_profile ProvisionedDevices >/dev/null 2>&1; then
            echo "::error::The profile lists no devices, so it is not an Ad Hoc profile."
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Apple's intermediate for distribution certificates, in case the image lacks it.
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/AppleWWDRCAG3.cer" \
            https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$keychain" >/dev/null 2>&1 || true
          security import "$cert" -k "$keychain" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          mapfile -t existing < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$cert"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Apple Distribution"; then
            echo "::error::The certificate holds no valid Apple Distribution identity."
            exit 1
          fi
          {
            echo "keychain=$keychain"
            echo "team=$team"
            echo "profile=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Archive the Release build
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          TEAM_ID: ${{ steps.signing.outputs.team }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile }}
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project Kira.xcodeproj -scheme Kira -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Kira.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            KIRA_PROVISIONING_PROFILE="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN"

      - name: Export the IPA
        env:
          TEAM_ID: ${{ steps.signing.outputs.team }}
          PROFILE_NAME: ${{ steps.signing.outputs.profile }}
        run: |
          set -euo pipefail
          options="$RUNNER_TEMP/ExportOptions.plist"
          python3 - "$options" <<'PY'
          import os, plistlib, sys
          with open(sys.argv[1], "wb") as out:
              plistlib.dump({
                  "method": "release-testing",
                  "signingStyle": "manual",
                  "teamID": os.environ["TEAM_ID"],
                  "signingCertificate": "Apple Distribution",
                  "provisioningProfiles": {os.environ["BUNDLE_ID"]: os.environ["PROFILE_NAME"]},
                  "stripSwiftSymbols": True,
                  "thinning": "<none>",
              }, out)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Kira.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$options"
          ls -la "$RUNNER_TEMP/export"

      - name: Keep the IPA for the distribute job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kira-ipa
          path: ${{ runner.temp }}/export/Kira.ipa
          retention-days: 1
          if-no-files-found: error

      - name: Remove the keychain and the profile
        if: always()
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then security delete-keychain "$KEYCHAIN" || true; fi
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
            "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.p12 "$RUNNER_TEMP/profile.plist"

  distribute:
    name: Distribute to Testers
    needs: build
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Workload Identity Federation exchanges GitHub's OIDC token for a Google one
    env:
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}

    steps:
      - name: Check the distribution inputs
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          ok=1
          if ! [[ "$FIREBASE_APP_ID" =~ ^1:[0-9]+:ios:[0-9a-f]+$ ]]; then
            echo "::error::Set the repository variable FIREBASE_APP_ID to the iOS app's id (1:<number>:ios:<hex>)."
            ok=0
          fi
          if [ -z "$FIREBASE_TESTER_GROUPS" ]; then
            echo "::error::Set the repository variable FIREBASE_TESTER_GROUPS (comma-separated group aliases)."
            ok=0
          fi
          if [ -n "$WORKLOAD_IDENTITY_PROVIDER" ] && [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Workload Identity Federation also needs the repository variable GCP_SERVICE_ACCOUNT."
            ok=0
          fi
          if [ -z "$WORKLOAD_IDENTITY_PROVIDER" ] && [ -z "$SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_SERVICE_ACCOUNT (variables), or the FIREBASE_SERVICE_ACCOUNT_JSON secret."
            ok=0
          fi
          if [ -n "$WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::Choose one sign-in: remove FIREBASE_SERVICE_ACCOUNT_JSON when Workload Identity Federation is set."
            ok=0
          fi
          [ "$ok" -eq 1 ]

      - name: Fetch the IPA
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kira-ipa
          path: ${{ runner.temp }}/ipa

      # Exactly one of the two is set: the check above refuses both and neither.
      - name: Sign in to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false

      - name: Upload and distribute
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          api=https://firebaseappdistribution.googleapis.com
          app="projects/$(cut -d: -f2 <<<"$FIREBASE_APP_ID")/apps/$FIREBASE_APP_ID"
          ipa="$RUNNER_TEMP/ipa/Kira.ipa"
          # The token goes to curl through a file, so it never sits in a process's arguments.
          umask 077
          header="$RUNNER_TEMP/authorization"
          printf 'Authorization: Bearer %s\n' "$ACCESS_TOKEN" > "$header"
          trap 'rm -f "$header"' EXIT

          operation="$(curl -fsS -X POST "$api/upload/v1/$app/releases:upload" -H @"$header" \
            -H "X-Goog-Upload-Protocol: raw" -H "X-Goog-Upload-File-Name: Kira.ipa" \
            -H "Content-Type: application/octet-stream" --data-binary @"$ipa" | jq -er .name)"

          result='{}'
          for _ in $(seq 1 60); do
            result="$(curl -fsS -H @"$header" "$api/v1/$operation")"
            [ "$(jq -r '.done // false' <<<"$result")" = true ] && break
            sleep 5
          done
          if ! jq -e '.done == true and .error == null' <<<"$result" >/dev/null; then
            echo "::error::The upload did not finish: $(jq -c '.error // "timed out after 5 minutes"' <<<"$result")"
            exit 1
          fi
          release="$(jq -er .response.release.name <<<"$result")"
          echo "Upload: $(jq -r .response.result <<<"$result") ($release)"

          notes="$(printf 'Build %s from %s\nPR #%s: %s' "$GITHUB_RUN_NUMBER" "${MERGE_SHA:0:7}" "$PR_NUMBER" "$PR_TITLE")"
          jq -n --arg text "$notes" '{releaseNotes: {text: $text}}' |
            curl -fsS -X PATCH "$api/v1/$release?updateMask=release_notes.text" -H @"$header" \
              -H "Content-Type: application/json" --data-binary @- >/dev/null

          jq -n --arg groups "$FIREBASE_TESTER_GROUPS" \
            '{groupAliases: ($groups | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0)))}' |
            curl -fsS -X POST "$api/v1/$release:distribute" -H @"$header" \
              -H "Content-Type: application/json" --data-binary @- >/dev/null
          echo "Distributed build $GITHUB_RUN_NUMBER to: $FIREBASE_TESTER_GROUPS"
